<div class="mx-auto max-w-lg rounded-xl border border-slate-200 bg-white p-8 text-center">
  <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-amber-100 text-amber-600">
    <i class="pi pi-lock text-2xl"></i>
  </div>
  <h1 class="mt-4 text-xl font-semibold text-slate-900">Acceso denegado</h1>
  <p class="mt-2 text-sm text-slate-500">
    Tu sesión es válida, pero tu rol no tiene permiso para esta pantalla.
  </p>

  @if (permission) {
    <div class="mt-4 rounded-xl bg-slate-900 px-4 py-3 text-left">
      <p class="text-[11px] uppercase text-slate-400">Permiso requerido</p>
      <code class="text-sm text-emerald-300">{{ permission }}</code>
    </div>
  }

  <a pButton routerLink="/dashboard" class="mt-6">
    <span pButtonLabel>Volver al panel</span>
  </a>
</div>
