<main class="flex min-h-screen items-center justify-center bg-slate-100 p-4">
  <p-card class="w-full max-w-md">
    <div class="mb-6 text-center">
      <div
        class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-emerald-600 text-white"
      >
        <i class="pi pi-heart-fill text-xl"></i>
      </div>
      <h1 class="mt-3 text-xl font-semibold text-slate-900">HuellaVet</h1>
      <p class="text-sm text-slate-500">Inicia sesión para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label for="login-identifier" class="mb-1 block text-sm font-medium text-slate-700">
          Usuario o correo
        </label>
        <input
          id="login-identifier"
          pInputText
          formControlName="identifier"
          autocomplete="username"
          class="w-full"
        />
        @if (form.controls.identifier.touched && form.controls.identifier.invalid) {
          <p-message severity="error" size="small" variant="simple" styleClass="mt-1">
            Escribe tu usuario o correo.
          </p-message>
        }
      </div>

      <div>
        <label for="login-password" class="mb-1 block text-sm font-medium text-slate-700">
          Contraseña
        </label>
        <p-password
          inputId="login-password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p-message severity="error" size="small" variant="simple" styleClass="mt-1">
            Escribe tu contraseña.
          </p-message>
        }
      </div>

      @if (error()) {
        <p-message severity="error" styleClass="w-full">{{ error() }}</p-message>
      }

      <button pButton type="submit" class="w-full" [loading]="loading()">
        <span pButtonLabel>Entrar</span>
      </button>
    </form>
  </p-card>
</main>
