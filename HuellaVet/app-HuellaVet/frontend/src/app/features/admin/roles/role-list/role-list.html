<app-page-header
  title="Roles"
  subtitle="Agrupan permisos. Un usuario recibe los de todos los roles activos que tenga asignados."
>
  <p-tag [value]="rows().length + ' roles'" severity="info" [rounded]="true" />
  <button *appHasPermission="'POST /api/roles'" pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i>
    <span pButtonLabel>Nuevo rol</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    dataKey="id"
    tableStyleClass="min-w-2xl"
  >
    <ng-template #caption>
      <div class="flex items-center gap-2">
        <i class="pi pi-search text-slate-400"></i>
        <input
          pInputText
          type="search"
          aria-label="Buscar roles"
          placeholder="Buscar por nombre o descripción…"
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
          class="w-full"
        />
      </div>
      @if (filter()) {
        <p class="mt-2 text-xs text-slate-500">
          {{ visibleRows().length }} de {{ rows().length }} coinciden con «{{ filter() }}».
        </p>
      }
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="name">
          <div class="flex items-center gap-1">Rol <p-sort-icon field="name" /></div>
        </th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-role>
      <tr>
        <td>
          <p class="font-medium text-slate-800">{{ role.name }}</p>
          <p class="text-xs text-slate-400">#{{ role.id }}</p>
        </td>
        <td class="text-sm text-slate-600">{{ role.description || '—' }}</td>
        <td><app-status-tag [active]="role.status === 'active'" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <button
              *appHasPermission="'PATCH /api/roles/:id'"
              pButton
              type="button"
              text
              rounded
              severity="secondary"
              icon="pi pi-pencil"
              aria-label="Editar rol"
              pTooltip="Editar"
              (click)="openEdit(role)"
            ></button>
            <button
              *appHasPermission="'PATCH /api/roles/:id/deactivate'"
              pButton
              type="button"
              text
              rounded
              severity="warn"
              icon="pi pi-ban"
              aria-label="Dar de baja el rol"
              [pTooltip]="isSessionRole(role) ? 'Tu sesión usa este rol' : 'Baja lógica'"
              [disabled]="isSessionRole(role) || role.status !== 'active'"
              (click)="deactivate(role)"
            ></button>
            <button
              *appHasPermission="'DELETE /api/roles/:id'"
              pButton
              type="button"
              text
              rounded
              severity="danger"
              icon="pi pi-trash"
              aria-label="Eliminar rol"
              [pTooltip]="isSessionRole(role) ? 'Tu sesión usa este rol' : 'Eliminar'"
              [disabled]="isSessionRole(role)"
              (click)="remove(role)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          @if (filter()) {
            <app-empty-state
              icon="pi pi-search"
              title="Sin coincidencias"
              message="Ningún rol coincide con la búsqueda. Borra el filtro para ver todos."
            />
          } @else {
            <app-empty-state
              icon="pi pi-key"
              title="Sin roles"
              message="Crea el primero con el botón «Nuevo rol»."
            />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-xl mx-4"
>
  <app-role-form
    [role]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
