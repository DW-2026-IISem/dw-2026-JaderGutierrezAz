<app-page-header
  title="Veterinarios"
  subtitle="Profesionales que atienden las citas. La baja lógica cambia su estado; la baja física elimina la fila."
>
  <p-tag [value]="rows().length + ' veterinarios'" severity="info" [rounded]="true" />
  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i>
    <span pButtonLabel>Nuevo veterinario</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    dataKey="id"
    tableStyleClass="min-w-3xl"
  >
    <ng-template #caption>
      <div class="flex items-center gap-2">
        <i class="pi pi-search text-slate-400"></i>
        <input
          pInputText
          type="search"
          aria-label="Buscar veterinarios"
          placeholder="Buscar por nombre o descripción…"
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
          class="w-full"
        />
      </div>
      @if (filter()) {
        <p class="mt-2 text-xs text-slate-500">
          {{ visibleRows().length }} de {{ rows().length }} coinciden con «{{ filter() }}».
        </p>
      }
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="name">
          <div class="flex items-center gap-1">Veterinario <p-sort-icon field="name" /></div>
        </th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-vet>
      <tr>
        <td>
          <p class="font-medium text-slate-800">{{ vet.name }}</p>
          <p class="text-xs text-slate-400">#{{ vet.id }}</p>
        </td>
        <td class="text-sm text-slate-600">{{ vet.description || '—' }}</td>
        <td><app-status-tag [active]="vet.is_active" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <button
              pButton
              type="button"
              text
              rounded
              severity="secondary"
              aria-label="Editar veterinario"
              pTooltip="Editar"
              (click)="openEdit(vet)"
            >
              <i pButtonIcon class="pi pi-pencil"></i>
            </button>
            <button
              pButton
              type="button"
              text
              rounded
              severity="warn"
              aria-label="Dar de baja al veterinario"
              pTooltip="Baja lógica"
              [disabled]="!vet.is_active"
              (click)="deactivate(vet)"
            >
              <i pButtonIcon class="pi pi-ban"></i>
            </button>
            <button
              pButton
              type="button"
              text
              rounded
              severity="danger"
              aria-label="Eliminar veterinario"
              pTooltip="Eliminar"
              (click)="remove(vet)"
            >
              <i pButtonIcon class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          @if (filter()) {
            <app-empty-state
              icon="pi pi-search"
              title="Sin coincidencias"
              message="Ningún veterinario coincide con la búsqueda. Borra el filtro para ver todos."
            />
          } @else {
            <app-empty-state
              icon="pi pi-id-card"
              title="Sin veterinarios"
              message="Crea el primero con el botón «Nuevo veterinario» o ejecuta el seeder del backend."
            />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-2xl mx-4"
>
  <app-veterinarian-form
    [veterinarian]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
